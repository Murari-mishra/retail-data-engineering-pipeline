x-airflow-common:
  &airflow-common

  build:
    context: .

  env_file:
    - .env

  environment:

    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:
      postgresql+psycopg2://postgres:postgres123@postgres:5432/airflow

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

    AIRFLOW__API__AUTH_BACKENDS:
      airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session

  volumes:

    - ./dags:/opt/airflow/dags

    - ./scripts:/opt/airflow/scripts

    - ./sql:/opt/airflow/sql

    - ./data:/opt/airflow/data

    - ./logs:/opt/airflow/logs

    - ./plugins:/opt/airflow/plugins

  depends_on:

    postgres:
      condition: service_healthy


services:

  postgres:

    image: postgres:13

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres123

      POSTGRES_DB: airflow

    volumes:

      - postgres-db-volume:/var/lib/postgresql/data

      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:

      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "postgres"
        ]

      interval: 10s

      timeout: 5s

      retries: 5


  airflow-init:

    <<: *airflow-common

    entrypoint: /bin/bash

    command:

      - -c

      - |

        airflow db migrate

        airflow users create \
          --username admin \
          --password admin \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email admin@example.com


  airflow-webserver:

    <<: *airflow-common

    command: webserver

    ports:

      - "8080:8080"

    depends_on:

      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:

    <<: *airflow-common

    command: scheduler

    depends_on:

      airflow-init:
        condition: service_completed_successfully


volumes:

  postgres-db-volume: